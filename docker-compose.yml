services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cryptogate
      POSTGRES_USER: liquidx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-liquidx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquidx -d cryptogate"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://liquidx:${DB_PASSWORD:-liquidx}@postgres:5432/cryptogate
      REDIS_URL: redis://redis:6379
    volumes:
      - candles:/app/data
    expose:
      - "4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # empty = same origin: the browser opens /socket.io on the Caddy host
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-}
    depends_on:
      agent:
        condition: service_healthy
    env_file: .env
    environment:
      AGENT_INTERNAL_URL: http://agent:4000
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  candles:
  caddy_data:
  caddy_config:
