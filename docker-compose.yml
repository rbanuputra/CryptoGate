services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cryptogate
      POSTGRES_USER: liquidx
      POSTGRES_PASSWORD: ${DB_PASSWORD:-liquidx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://liquidx:${DB_PASSWORD:-liquidx}@postgres:5432/cryptogate
      REDIS_URL: redis://redis:6379
    env_file: .env
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - agent
    environment:
      NEXT_PUBLIC_AGENT_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: http://localhost:4000
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
